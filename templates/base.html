{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Bexceptional · Rise above the ordinary{% endblock %}</title>
  <meta name="description" content="{% block descripcion %}Ropa deportiva y una guía de hábitos respaldada por la ciencia para quien busca superarse cada día.{% endblock %}">

  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{% static 'img/favicon-180.png' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="flex min-h-screen flex-col bg-claro font-sans text-tinta antialiased">
  <a href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-crema focus:px-4 focus:py-2 focus:text-negro">Saltar al contenido</a>

  {% include "partials/_cabecera.html" %}

  <main id="contenido" class="flex-1">
    {% block contenido %}{% endblock %}
  </main>

  {% include "partials/_pie.html" %}
</body>
</html>
