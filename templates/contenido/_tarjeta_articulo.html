<a href="{% url 'contenido:articulo' articulo.slug %}" class="group flex h-full flex-col rounded-2xl bg-white p-6 ring-1 ring-black/5 transition hover:shadow-xl">
  <p class="bx-eyebrow text-rojo">{{ articulo.disciplina.nombre|default:"Hábitos" }}</p>
  <h3 class="mt-3 text-lg font-extrabold leading-snug text-negro group-hover:underline">{{ articulo.titulo }}</h3>
  <p class="mt-2 flex-1 text-sm leading-relaxed text-linea">{{ articulo.resumen }}</p>
  <p class="mt-4 text-sm font-bold text-negro">Leer artículo →</p>
</a>
